<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Cassette Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .demo-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .demo-container {
            max-width: 900px;
            width: 100%;
        }

        /* Cassette body */
        .cassette-body {
            background: linear-gradient(145deg, #9a9a9a 0%, #7a7a7a 50%, #6a6a6a 100%);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            position: relative;
            aspect-ratio: 2 / 1.3;
            border: 3px solid #5a5a5a;
        }

        /* Top label section */
        .cassette-top-section {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            height: 20%;
            background: #fff;
            border-radius: 3px;
            border: 2px solid #999;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
        }

        .cassette-gold-label {
            background: linear-gradient(135deg, #ffc107 0%, #d4aa00 50%, #b8920d 100%);
            height: 100%;
            width: 24%;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            color: #000;
            text-align: center;
            line-height: 1.3;
        }

        .cassette-title-area {
            flex: 1;
            font-size: 12px;
        }

        .cassette-title {
            font-weight: bold;
            margin: 0;
            color: #000;
            font-size: 13px;
        }

        .cassette-side {
            font-size: 10px;
            color: #666;
            margin: 3px 0 0 0;
        }

        /* Window with reels */
        .cassette-window {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            height: 46%;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 6px;
            border: 2px solid #504f4f;
            overflow: hidden;
        }

        /* Tape mechanism container */
        .tape-mechanism {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* Silver background - positioned in center */
        .tape-background {
            position: absolute;
            background: #e0e0e0;
            width: 28%;
            height: 45%;
            border-radius: 2px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* Tape connecting strips (static) */
        .tape-strips {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .tape-strips svg {
            transform: scale(1.3);
        }

        /* Reel containers */
        .reel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 0%;
            z-index: 3;
        }

        /* Bottom cassette piece */
        .cassette-bottom {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
            bottom: 0;
        }

        .cassette-bottom svg {
            position: absolute;
            bottom: 0%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: auto;
        }

        /* Individual reels (dark circles with white gear patterns) */
        .reel {
            width: 50%;
            height: 100%;
            position: relative;
        }

        .reel svg {
            width: 100%;
            height: 100%;
        }

        .reel.spinning .gear-rotation {
            animation: reelSpin 3s linear infinite;
            transform-origin: 350.75px 159.48px;
        }

        @keyframes reelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            text-align: center;
        }

        button {
            margin: 5px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #4a4a4a;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a5a5a;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

    <script>
        const leftReel = document.getElementById('left-reel');
        const rightReel = document.getElementById('right-reel');
        const playBtn = document.getElementById('play');
        const stopBtn = document.getElementById('stop');

        let playing = false;

        playBtn.addEventListener('click', () => {
            playing = !playing;
            if (playing) {
                leftReel.classList.add('spinning');
                rightReel.classList.add('spinning');
                playBtn.textContent = '⏸️ Pause';
            } else {
                leftReel.classList.remove('spinning');
                rightReel.classList.remove('spinning');
                playBtn.textContent = '▶️ Play';
            }
        });

        stopBtn.addEventListener('click', () => {
            playing = false;
            leftReel.classList.remove('spinning');
            rightReel.classList.remove('spinning');
            playBtn.textContent = '▶️ Play';
        });

        // Auto-start
        setTimeout(() => playBtn.click(), 500);
    </script>
